<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sélecteur de groupe</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 4px;
    }

    select {
      width: 100%;
      height: 38px;

      padding: 0 12px;

      border: 1px solid #cbd5e1;
      border-radius: 8px;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
      outline: none;

      background-color: white;
      color: #334155;
    }

    select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.12);
    }

    option {
      font-weight: 700;
    }

    /* BAC PRO */
    .bacpro {
      background-color: #dbeafe;
      color: #1e3a8a;
    }

    /* BTS / BTSA */
    .bts {
      background-color: #ede9fe;
      color: #5b21b6;
    }

    /* CAP / CAPa */
    .cap {
      background-color: #dcfce7;
      color: #166534;
    }

    /* CS */
    .cs {
      background-color: #ffedd5;
      color: #9a3412;
    }

    /* Licence */
    .licence {
      background-color: #fee2e2;
      color: #991b1b;
    }

    /* Autres */
    .autre {
      background-color: #f1f5f9;
      color: #334155;
    }
  </style>
</head>

<body>

  <select id="groupes">
    <option value="">-- Tous / sélectionner un groupe --</option>
  </select>

  <script>

    const select = document.getElementById("groupes");

    let recordsById = new Map();


    /*
      Le widget :
      - lit une table choisie dans Grist
      - permet de mapper une colonne
      - peut servir de source de liaison
    */

    grist.ready({
      requiredAccess: "read table",
      allowSelectBy: true,

      columns: [
        {
          name: "GROUPE",
          title: "Colonne des groupes",
          type: "Any",
          optional: false
        }
      ]
    });


    function getCategory(value) {

      if (!value) {
        return "autre";
      }

      const text = String(value)
        .trim()
        .toUpperCase();

      if (text.startsWith("BAC PRO")) {
        return "bacpro";
      }

      if (
        text.startsWith("BTS ") ||
        text.startsWith("BTSA ")
      ) {
        return "bts";
      }

      if (
        text.startsWith("CAP ") ||
        text.startsWith("CAPA ")
      ) {
        return "cap";
      }

      if (text.startsWith("CS ")) {
        return "cs";
      }

      if (text.startsWith("LICENCE")) {
        return "licence";
      }

      return "autre";
    }


    function applyColor(value) {

      select.classList.remove(
        "bacpro",
        "bts",
        "cap",
        "cs",
        "licence",
        "autre"
      );

      if (!value) {
        select.style.backgroundColor = "white";
        select.style.color = "#334155";
        return;
      }

      select.style.backgroundColor = "";
      select.style.color = "";

      select.classList.add(
        getCategory(value)
      );
    }


    function buildMenu(records) {

      const currentValue = select.value;

      recordsById.clear();

      select.innerHTML =
        '<option value="">-- Tous / sélectionner un groupe --</option>';


      const rows = [];

      records.forEach(record => {

        const mapped =
          grist.mapColumnNames(record);

        if (!mapped) {
          return;
        }

        const value = mapped.GROUPE;

        if (
          value === null ||
          value === undefined ||
          String(value).trim() === ""
        ) {
          return;
        }

        rows.push({
          id: record.id,
          label: String(value).trim()
        });

      });


      rows.sort((a, b) =>
        a.label.localeCompare(
          b.label,
          "fr",
          {
            sensitivity: "base"
          }
        )
      );


      rows.forEach(row => {

        recordsById.set(
          String(row.id),
          row
        );

        const option =
          document.createElement("option");

        option.value =
          String(row.id);

        option.textContent =
          row.label;

        option.classList.add(
          getCategory(row.label)
        );

        select.appendChild(option);

      });


      if (
        currentValue &&
        recordsById.has(currentValue)
      ) {
        select.value = currentValue;

        applyColor(
          recordsById.get(currentValue).label
        );
      }

    }


    /*
      Récupère toutes les lignes de la table
      choisie pour ce widget.
    */

    grist.onRecords(function(records) {

      buildMenu(records || []);

    });


    /*
      Si Grist déplace lui-même le curseur
      dans la table des groupes,
      le menu suit la sélection.
    */

    grist.onRecord(function(record) {

      if (!record) {
        return;
      }

      const mapped =
        grist.mapColumnNames(record);

      if (!mapped) {
        return;
      }

      const rowId =
        String(record.id);

      if (recordsById.has(rowId)) {

        select.value = rowId;

        applyColor(
          mapped.GROUPE
        );

      }

    });


    /*
      Quand on choisit un groupe :
      on déplace simplement la sélection Grist
      vers la ligne correspondante.

      AUCUNE donnée n'est modifiée.
    */

    select.addEventListener(
      "change",
      async function() {

        const rowId =
          select.value;

        if (!rowId) {

          applyColor("");

          return;
        }


        const row =
          recordsById.get(rowId);

        if (!row) {
          return;
        }


        applyColor(row.label);


        try {

          await grist.setCursorPos({
            rowId: Number(rowId)
          });

        } catch (error) {

          console.error(
            "Erreur de sélection :",
            error
          );

        }

      }
    );

  </script>

</body>
</html>
