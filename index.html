<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Groupes Grist</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f7f8fa;
    }

    .widget {
      max-width: 500px;
      margin: 0 auto;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    select {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #d0d5dd;
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      background-color: white;
    }

    select:focus {
      border-color: #4f46e5;
    }

    option {
      font-weight: bold;
      padding: 8px;
    }

    .info {
      margin-top: 10px;
      font-size: 12px;
      color: #667085;
    }

    /* BAC PRO */
    .bacpro {
      background-color: #dbeafe;
      color: #1e3a8a;
    }

    /* BTS / BTSA */
    .bts {
      background-color: #ede9fe;
      color: #5b21b6;
    }

    /* CAP / CAPa */
    .cap {
      background-color: #dcfce7;
      color: #166534;
    }

    /* CS */
    .cs {
      background-color: #ffedd5;
      color: #9a3412;
    }

    /* Licence */
    .licence {
      background-color: #fee2e2;
      color: #991b1b;
    }

    /* Autres */
    .autre {
      background-color: #f3f4f6;
      color: #374151;
    }
  </style>
</head>

<body>

  <div class="widget">

    <label for="groupes">GROUPE</label>

    <select id="groupes">
      <option value="">-- Sélectionner un groupe --</option>
    </select>

    <div class="info" id="info">
      Sélectionne une table et une colonne dans la configuration du widget.
    </div>

  </div>

  <script>

    const select = document.getElementById("groupes");
    const info = document.getElementById("info");

    let currentRecord = null;
    let currentMappings = null;
    let allRecords = [];


    /*
      Grist affichera un sélecteur de colonne
      dans la configuration du widget.
    */

    grist.ready({
      requiredAccess: "full",

      columns: [
        {
          name: "GROUPE",
          title: "Colonne des groupes",
          type: "Any",
          optional: false,
          allowMultiple: false,
          description: "Choisis la colonne contenant les noms des groupes"
        }
      ]
    });


    /*
      Détermine la catégorie d'un groupe
      à partir de son nom.
    */

    function getCategory(value) {

      if (!value) {
        return "autre";
      }

      const text = String(value).trim().toUpperCase();

      if (text.startsWith("BAC PRO")) {
        return "bacpro";
      }

      if (
        text.startsWith("BTS ") ||
        text.startsWith("BTSA ")
      ) {
        return "bts";
      }

      if (
        text.startsWith("CAP ") ||
        text.startsWith("CAPA ")
      ) {
        return "cap";
      }

      if (text.startsWith("CS ")) {
        return "cs";
      }

      if (text.startsWith("LICENCE")) {
        return "licence";
      }

      return "autre";
    }


    /*
      Applique la couleur au select fermé.
    */

    function applySelectColor(value) {

      select.classList.remove(
        "bacpro",
        "bts",
        "cap",
        "cs",
        "licence",
        "autre"
      );

      if (!value) {
        select.style.backgroundColor = "white";
        select.style.color = "#333";
        return;
      }

      const category = getCategory(value);

      select.classList.add(category);
    }


    /*
      Reconstruit la liste déroulante
      à partir des valeurs présentes
      dans la colonne choisie.
    */

    function buildMenu(records) {

      select.innerHTML =
        '<option value="">-- Sélectionner un groupe --</option>';

      const values = new Set();

      records.forEach(record => {

        const mapped = grist.mapColumnNames(record);

        if (!mapped) {
          return;
        }

        const value = mapped.GROUPE;

        if (
          value !== null &&
          value !== undefined &&
          String(value).trim() !== ""
        ) {
          values.add(String(value).trim());
        }

      });


      const sortedValues = Array
        .from(values)
        .sort((a, b) =>
          a.localeCompare(b, "fr", {
            sensitivity: "base"
          })
        );


      sortedValues.forEach(value => {

        const option = document.createElement("option");

        option.value = value;
        option.textContent = value;

        option.classList.add(
          getCategory(value)
        );

        select.appendChild(option);

      });


      info.textContent =
        sortedValues.length +
        " ligne(s) trouvé(s) dans la colonne sélectionnée.";

    }


    /*
      Appelé quand les données de la table changent.
      Donc si tu ajoutes un groupe dans Grist,
      le menu se met à jour automatiquement.
    */

    grist.onRecords(function(records, mappings) {

      currentMappings = mappings;

      allRecords = records || [];

      buildMenu(allRecords);

    });


    /*
      Appelé lorsqu'on change de ligne
      dans Grist.
    */

    grist.onRecord(function(record, mappings) {

      currentRecord = record;
      currentMappings = mappings;

      if (!record) {
        select.value = "";
        applySelectColor("");
        return;
      }

      const mapped = grist.mapColumnNames(record);

      if (!mapped) {

        select.value = "";
        applySelectColor("");

        info.textContent =
          "Choisis une colonne dans la configuration du widget.";

        return;
      }

      const value =
        mapped.GROUPE === null ||
        mapped.GROUPE === undefined
          ? ""
          : String(mapped.GROUPE);

      select.value = value;

      applySelectColor(value);

    });


    /*
      Quand on choisit un groupe,
      on modifie la ligne sélectionnée dans Grist.
    */

    select.addEventListener("change", async function() {

      const value = select.value;

      applySelectColor(value);

      if (!currentRecord || !currentRecord.id) {
        return;
      }

      try {

        /*
          On crée d'abord un objet utilisant
          le nom logique "GROUPE".
        */

        const mappedRecord = {
          id: currentRecord.id,
          GROUPE: value
        };


        /*
          Grist reconvertit ensuite "GROUPE"
          vers le vrai nom de colonne choisi
          dans le panneau du widget.
        */

        const originalRecord =
          grist.mapColumnNamesBack(
            mappedRecord,
            {
              mappings: currentMappings
            }
          );


        await grist.selectedTable.update({
          id: currentRecord.id,
          fields: {
            [currentMappings.GROUPE]: value
          }
        });


      } catch (error) {

        console.error(
          "Erreur lors de la mise à jour :",
          error
        );

        info.textContent =
          "Erreur lors de la mise à jour de Grist.";

      }

    });

  </script>

</body>
</html>
